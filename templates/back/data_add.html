{% extends 'back/_base.html' %}
{% set title = '新增考勤' %}
{% block content %}
  <div class="page-head">
    <h1>新增考勤</h1>
    <div class="actions"><a class="btn gray" href="{{ url_for('web.roll_call') }}">全班一起点？用批量点名</a></div>
  </div>
  {% set record = None %}
  {% include 'back/_record_form.html' %}
{% endblock %}

{% block scripts %}
<script>
  const form = document.querySelector('#form');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(!form.student_no.value){ toast('请选择学生', false); return; }
    const btn = document.querySelector('#btnSave'); btn.disabled = true;
    const json = await postJSON('/back/attendance/api/add', Object.fromEntries(new FormData(form).entries()));
    btn.disabled = false;
    if(json.code === 200){
      toast(json.msg || '保存成功');
      // 保留日期，清空其他项，方便连续录入下一位
      const keepDate = form.date.value;
      form.reset(); form.date.value = keepDate;
      return;
    }
    toast(json.msg || '保存失败', false);
  });
</script>
{% endblock %}
