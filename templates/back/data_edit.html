{% extends 'back/_base.html' %}
{% set title = '编辑考勤' %}
{% block content %}
  <div class="page-head"><h1>编辑考勤</h1></div>
  {% include 'back/_record_form.html' %}
{% endblock %}

{% block scripts %}
<script>
  const form = document.querySelector('#form');
  const id = {{ record.id | int }};
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(!form.student_no.value){ toast('请选择学生', false); return; }
    const btn = document.querySelector('#btnSave'); btn.disabled = true;
    const json = await postJSON('/back/attendance/api/update/' + id, Object.fromEntries(new FormData(form).entries()));
    btn.disabled = false;
    if(json.code === 200){
      toast(json.msg || '修改成功');
      // 回到来时的列表页（保留筛选和页码）
      const back = document.referrer.includes('/back/') ? document.referrer : '/back/attendance/list';
      setTimeout(() => { location.href = back; }, 700);
      return;
    }
    toast(json.msg || '修改失败', false);
  });
</script>
{% endblock %}
