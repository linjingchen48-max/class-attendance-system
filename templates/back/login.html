<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>班主任登录 - 班级考勤管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='back/admin.css') }}">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh;
      background: linear-gradient(135deg, #1f2a37 0%, #2c3e50 100%); padding: 16px; }
    .box { width: 100%; max-width: 380px; background: #fff; border-radius: 10px; padding: 30px 28px 26px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25); }
    .box h1 { font-size: 22px; margin: 0 0 4px; }
    .box .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
    .box .form-row { margin-bottom: 14px; }
    .box button { width: 100%; justify-content: center; padding: 10px; font-size: 15px; margin-top: 6px; }
    .msg { margin-top: 12px; color: var(--danger); min-height: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <form class="box" id="form" novalidate>
    <h1>班级考勤管理</h1>
    <p class="sub">班主任后台登录</p>
    <div class="form-row">
      <label for="username">账号</label>
      <input id="username" autocomplete="username" autofocus>
    </div>
    <div class="form-row">
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
    <button class="btn" id="btnLogin" type="submit">登录</button>
    <div class="msg" id="msg"></div>
  </form>

  <script>
    const $ = (s)=>document.querySelector(s);
    // 用 form 的 submit 事件：点按钮和按回车都能登录
    $('#form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      $('#msg').textContent = '';
      const username = $('#username').value.trim();
      const password = $('#password').value;
      if(!username || !password){
        $('#msg').textContent = '请输入账号和密码';
        return;
      }
      $('#btnLogin').disabled = true;
      try{
        const res = await fetch('/back/login', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({username, password})
        });
        const json = await res.json();
        if(json.code === 200){
          location.href = json.redirect || '/back/attendance/list';
          return;
        }
        $('#msg').textContent = json.msg || '登录失败';
      }catch(err){
        $('#msg').textContent = '网络错误，请稍后重试';
      }
      $('#btnLogin').disabled = false;
    });
  </script>
</body>
</html>
