<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ class_name or '班级' }}考勤可视化大屏</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='front/css/index.css') }}">
</head>
<body>
  <div class="screen">
    <div class="header">
      <div class="title"><span id="className">{{ class_name or '班级' }}</span>考勤可视化大屏</div>
      <div class="timebox">
        <div class="now" id="nowTime">--</div>
        <div>数据最后更新时间：<span id="lastUpdate">--</span></div>
      </div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="label"><span class="badge"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>今日应到</div>
        <div class="value"><span id="cTotal">--</span><span class="unit">人</span></div>
        <div class="sub">学生名册人数</div>
      </div>
      <div class="card">
        <div class="label"><span class="badge"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M16 11l2 2 4-4"/></svg></span>实到人数</div>
        <div class="value"><span id="cPresent">--</span><span class="unit">人</span></div>
        <div class="sub">正常+迟到</div>
      </div>
      <div class="card">
        <div class="label"><span class="badge"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M21 3v9h-9"/></svg></span>出勤率</div>
        <div class="value"><span id="cRate">--</span></div>
        <div class="sub">实到/应到</div>
      </div>
      <div class="card">
        <div class="label"><span class="badge"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>迟到</div>
        <div class="value warn"><span id="cLate">--</span><span class="unit">人</span></div>
        <div class="sub">08:00后到</div>
      </div>
      <div class="card">
        <div class="label"><span class="badge"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>请假</div>
        <div class="value info"><span id="cLeave">--</span><span class="unit">人</span></div>
        <div class="sub">含病假/事假</div>
      </div>
      <div class="card">
        <div class="label"><span class="badge"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg></span>旷课</div>
        <div class="value danger"><span id="cAbsent">--</span><span class="unit">人</span></div>
        <div class="sub">未到未请假</div>
      </div>
      <div class="card">
        <div class="label"><span class="badge"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg></span>未登记</div>
        <div class="value muted"><span id="cUnreg">--</span><span class="unit">人</span></div>
        <div class="sub">今天还没录考勤</div>
      </div>
    </div>

    <div class="panels">
      <div class="panel">
        <h3>今日考勤构成</h3>
        <div id="pieChart" class="chart"></div>
      </div>

      <div class="panel">
        <h3>近7天班级出勤率趋势</h3>
        <div id="lineChart" class="chart"></div>
      </div>

      <div class="panel">
        <h3>今日异常学生 <span class="count" id="abnCount"></span></h3>
        <div class="tablewrap">
          <table class="table">
            <thead>
              <tr>
                <th style="width:24%;">姓名</th>
                <th style="width:24%;">类型</th>
                <th style="width:18%;">时间</th>
                <th>备注</th>
              </tr>
            </thead>
            <tbody id="abnormalBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='front/js/echarts.min.js') }}"></script>
  <script src="{{ url_for('static', filename='front/js/index.js') }}"></script>
</body>
</html>
